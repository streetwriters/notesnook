name: Publish Notesnook Help

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "docs/help/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # VitePress reads git history to show the last updated date per page.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The docs consume both packages as built output: intl supplies the UI
      # labels resolved at build time, common supplies the keybinding registry
      # keyboard-shortcuts.md is generated from.
      - name: Build string catalogue
        run: npm ci && npm run build
        working-directory: packages/intl

      - name: Build shared package
        run: npm run build
        working-directory: packages/common

      - name: Install dependencies
        run: npm ci
        working-directory: docs/help

      - name: Build site
        run: npm run docs:build
        working-directory: docs/help

      - name: Setup environment
        run: |
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV

      - name: Publish on Cloudflare Pages
        run: npx --yes wrangler pages deploy --project-name notesnook-help ./docs/help/.vitepress/dist/ --branch main
